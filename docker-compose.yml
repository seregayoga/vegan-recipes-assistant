services:
  postgres:
    image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    volumes: ["postgres_data:/var/lib/postgresql/data", "./sql:/docker-entrypoint-initdb.d:ro"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes"]
      interval: 5s
      timeout: 5s
      retries: 12
  ingest:
    build: .
    command: ["/app/.venv/bin/python", "ingest.py"]
    env_file: [.env]
    environment:
      HF_HOME: /model-cache
    volumes: ["model_cache:/model-cache"]
    depends_on:
      postgres: {condition: service_healthy}
    profiles: ["ingest"]
  app:
    build: .
    env_file: [.env]
    environment:
      HF_HOME: /model-cache
    volumes: ["model_cache:/model-cache"]
    ports: ["8501:8501"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  evaluate:
    build: .
    command: ["/app/.venv/bin/python", "evaluation/retrieval_eval.py"]
    env_file: [.env]
    environment:
      HF_HOME: /model-cache
    volumes:
      - model_cache:/model-cache
      - ./evaluation:/app/evaluation
    depends_on:
      postgres: {condition: service_healthy}
    profiles: ["evaluation"]
  grafana:
    image: grafana/grafana@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
  model_cache:

